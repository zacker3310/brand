services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas
    ports: ["5432:5432"]
    volumes: ["atlas-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  worker:
    build: .
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/atlas
    depends_on:
      db: { condition: service_healthy }
    profiles: ["worker"]
  web:
    build: .
    command: ["sh", "-c", "npm run build && npm run start"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/atlas
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    profiles: ["web"]
volumes:
  atlas-pg: {}
